<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurio — Marketplace de NFTs</title>
    <meta
      name="description"
      content="Kurio: descubra, colecione e compre NFTs selecionados de criadores emergentes e consagrados."
    />
    <meta name="theme-color" content="#140d0a" />
    <style>
      /* Boot splash: shown while the bundle and the mock backend start, removed after the first
         render (see src/main.tsx). Fades in after 150ms so fast loads never flash it. */
      html {
        background: #140d0a;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(60% 50% at 50% 42%, #241612 0%, #140d0a 70%);
        pointer-events: none;
        transition:
          opacity 280ms ease,
          visibility 280ms;
      }
      #boot-splash.is-done {
        opacity: 0;
        visibility: hidden;
      }
      #boot-splash .boot-inner {
        display: grid;
        justify-items: center;
        gap: 22px;
        opacity: 0;
        animation: boot-in 420ms ease 150ms forwards;
      }
      #boot-splash svg {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 10px 28px rgb(210 138 76 / 0.28));
        animation: boot-breathe 1.8s ease-in-out infinite;
      }
      #boot-splash .boot-bar {
        position: relative;
        width: 96px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: #3f2319;
      }
      #boot-splash .boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #e89b55, transparent);
        animation: boot-sweep 1.1s ease-in-out infinite;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-breathe {
        50% {
          transform: scale(1.04);
        }
      }
      @keyframes boot-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg,
        #boot-splash .boot-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-inner">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient
              id="boot-k"
              x1="14"
              y1="12"
              x2="52"
              y2="54"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0" stop-color="#f4b06c" />
              <stop offset="0.5" stop-color="#e89b55" />
              <stop offset="1" stop-color="#b8743f" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="15" fill="#241612" />
          <rect
            x="0.75"
            y="0.75"
            width="62.5"
            height="62.5"
            rx="14.25"
            fill="none"
            stroke="#55321f"
            stroke-width="1.5"
          />
          <path
            fill="url(#boot-k)"
            d="M17 14h9v13.6L38.4 14H50L35.4 30.4 50.6 50H39.3L29.5 37.2 26 41v9h-9z"
          />
          <path fill="#f0805f" d="M47 8.5l2.5 2.5-2.5 2.5-2.5-2.5z" />
        </svg>
        <div class="boot-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
